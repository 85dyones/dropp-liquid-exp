<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Modo barra</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Archivo:wdth,wght@62..125,400..800&amp;family=Courier+Prime:ital,wght@0,400;0,700;1,400&amp;display=swap"><style>body{margin:0;background-color:var(--papel)}</style></head>
<body>
<div style="display:grid;grid-template-columns:1fr 1fr">
  <div class="dp-tela" data-theme="papel">
    <span class="dp-rot">Papel · día</span>
    <div class="dp-papel dp-papel--corte">
      <span class="dp-rot">Lote LIM-022</span>
      <span class="dp-lote-tempo" style="color:var(--tinta-laranja)">Se acaba hoy</span>
      <span class="dp-lote-nome">Cordial de lima</span>
      <span class="dp-regua-lote" aria-hidden="true"><span class="dp-rl-trilho"><span class="dp-rl-enchido" style="width:85%;background:var(--tinta-laranja)"></span></span><span class="dp-rl-hoje" style="left:85%"></span></span>
      <ul class="dp-chk"><li><span class="dp-st dp-st--ok">leída 22:40</span><span>Botella #6</span></li></ul>
    </div>
    <button type="button" class="dp-btn dp-btn--cheio dp-btn--largo">Comprobar la estación</button>
  </div>
  <div class="dp-tela" data-theme="balcao">
    <span class="dp-rot">Barra · noche</span>
    <div class="dp-papel dp-papel--corte">
      <span class="dp-rot">Lote LIM-022</span>
      <span class="dp-lote-tempo" style="color:var(--tinta-laranja)">Se acaba hoy</span>
      <span class="dp-lote-nome">Cordial de lima</span>
      <span class="dp-regua-lote" aria-hidden="true"><span class="dp-rl-trilho"><span class="dp-rl-enchido" style="width:85%;background:var(--tinta-laranja)"></span></span><span class="dp-rl-hoje" style="left:85%"></span></span>
      <ul class="dp-chk"><li><span class="dp-st dp-st--ok">leída 22:40</span><span>Botella #6</span></li></ul>
    </div>
    <button type="button" class="dp-btn dp-btn--cheio dp-btn--largo">Comprobar la estación</button>
  </div>
</div>
</body>
</html>
