<!doctype html>

body { margin: 0; }
.capa { position: relative; width: 960px; height: 320px; background: var(--papel); overflow: hidden; }
.capa svg { position: absolute; left: 0; top: 0; width: 960px; height: 120px; display: block; }
.b-tinta { fill: var(--tinta); }
.b-amarelo { fill: var(--gota-amarelo); }
.b-magenta { fill: var(--gota-magenta); }
.b-ciano { fill: var(--gota-ciano); }
.b-laranja { fill: var(--gota-laranja); }
.furo { fill: var(--papel); }
.nome { position: absolute; left: 40px; top: 146px; max-width: 880px; font-family: var(--font-display); font-weight: 400; font-size: 64px; line-height: 0.95; color: var(--tinta); margin: 0; }
.linha { position: absolute; left: 40px; top: 284px; max-width: 880px; font-family: var(--font-texto); font-size: 14px; line-height: 1.4; color: var(--tinta-suave); margin: 0; }
</style></head>

<div class="capa">
<!-- blocos: tinta 432px, amarelo 192px, magenta 168px, ciano 84px, laranja 84px, todos com 112px de altura e raio-0 (cantos retos, como etiqueta cortada)
