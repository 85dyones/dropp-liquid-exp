<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Recado</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Archivo:wdth,wght@62..125,400..800&amp;family=Courier+Prime:ital,wght@0,400;0,700;1,400&amp;display=swap"><style>body{margin:0;background-color:var(--papel)}</style></head>
<body>
<div class="dp-tela">
  <div class="dp-papel dp-papel--corte dp-recado">
    <div class="dp-recado-cab"><span class="dp-cadeira"><span class="dp-cadeira-ponto dp-cad-fin"></span>Financeiro</span><span class="dp-nivel">sugere</span></div>
    <p class="dp-recado-tit">Freela de evento no sábado: cobre €180, não €120.</p>
    <dl class="dp-linhas">
      <div><dt>Por quê</dt><dd>Sua noite no Bar Salitre rende €151 em média, com gorjetas.</dd></div>
      <div><dt>Inclui</dt><dd>5 horas e 2 drinks autorais</dd></div>
    </dl>
    <p class="dp-fonte">Seus registros de setembro a novembro. Valores ilustrativos.</p>
    <div class="dp-linha-btns"><button type="button" class="dp-btn dp-btn--cheio">Responder €180</button><button type="button" class="dp-btn">Aceitar €120</button></div>
  </div>
</div>
</body>
</html>
