<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Carimbo</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Archivo:wdth,wght@62..125,400..800&amp;family=Courier+Prime:ital,wght@0,400;0,700;1,400&amp;display=swap"><style>body{margin:0;background-color:var(--papel)}</style></head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><filter id="tinta-gasta" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4" result="ruido"></feTurbulence><feDisplacementMap in="SourceGraphic" in2="ruido" scale="1.6" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap></filter></svg><div class="dp-tela" style="grid-template-columns:repeat(3,minmax(0,1fr));align-items:center;justify-items:center">
  <span class="dp-carimbo dp-cor-jornada" style="transform:rotate(3deg)"><span>Jornada</span><span class="dp-carimbo-tit">Bar Brasa</span><span class="dp-carimbo-linha">Madri · 14/11/2026</span></span>
  <span class="dp-carimbo dp-carimbo--oval dp-cor-carta" style="transform:rotate(-3deg)"><span>Carta</span><span class="dp-carimbo-tit">Shrub de gengibre</span><span class="dp-carimbo-linha">carta de outono</span></span>
  <span class="dp-carimbo dp-carimbo--redondo dp-cor-casa" style="transform:rotate(6deg)"><span>Casa</span><span class="dp-carimbo-tit">Bar Salitre</span><span class="dp-carimbo-linha">VLC · desde 2022</span></span>
  <span class="dp-carimbo dp-cor-escola" style="transform:rotate(4deg)"><span>Escola</span><span class="dp-carimbo-tit">Clarificação</span><span class="dp-carimbo-linha">prática aprovada</span></span>
  <span class="dp-carimbo dp-carimbo--redondo dp-carimbo--pendente dp-cor-arquivo" style="transform:rotate(5deg)"><span>Arquivo</span><span class="dp-carimbo-tit">Hanky Panky</span><span class="dp-carimbo-linha">Ada Coleman</span></span>
  <span class="dp-carimbo dp-cor-brinde" style="transform:rotate(-4deg)"><span>Brinde</span><span class="dp-carimbo-tit">Tomás V.</span><span class="dp-carimbo-linha">Lisboa · 21/09</span></span>
</div>
</body>
</html>
