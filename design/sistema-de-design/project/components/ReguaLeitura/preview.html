<!-- @dsCard group="Medidas" height=140 -->
<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Régua de leitura</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Archivo:wdth,wght@62..125,400..800&amp;family=Courier+Prime:ital,wght@0,400;0,700;1,400&amp;display=swap"><style>body{margin:0;background-color:var(--papel)}</style></head>
<body>
<div class="dp-tela" style="padding:0">
  <div class="dp-regua-leitura">
    <div class="dp-rl-cab"><div class="dp-rl-l"><b class="dp-rl-med">−18 °C</b><span class="dp-rl-uni">freezer, sem tampa</span></div><span class="dp-rl-passo">passo 2 de 5</span></div>
    <div class="dp-rl-ticks">
      <span class="dp-rl-linha"></span><span class="dp-rl-feito" style="width:20%"></span>
      <button type="button" class="dp-rl-tick" data-feito="true" aria-label="Passo 1: 10 L"><span class="dp-rl-dot"></span><span class="dp-rl-tk">10 L</span></button>
      <button type="button" class="dp-rl-tick" aria-current="true" aria-label="Passo 2: −18 °C"><span class="dp-rl-dot"></span><span class="dp-rl-tk">−18 °C</span></button>
      <button type="button" class="dp-rl-tick" aria-label="Passo 3: 30 h"><span class="dp-rl-dot"></span><span class="dp-rl-tk">30 h</span></button>
      <button type="button" class="dp-rl-tick" aria-label="Passo 4: 10 min"><span class="dp-rl-dot"></span><span class="dp-rl-tk">10 min</span></button>
      <button type="button" class="dp-rl-tick" aria-label="Passo 5: 7 kg"><span class="dp-rl-dot"></span><span class="dp-rl-tk">7 kg</span></button>
    </div>
  </div>
</div>
</body>
</html>
