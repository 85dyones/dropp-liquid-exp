<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Seleção</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Archivo:wdth,wght@62..125,400..800&amp;family=Courier+Prime:ital,wght@0,400;0,700;1,400&amp;display=swap"><style>body{margin:0;background-color:var(--papel)}</style></head>
<body>
<div class="dp-tela">
  <div class="dp-seg-row dp-seg-row--quatro" role="group" aria-label="Qual conta">
    <button type="button" class="dp-seg">Batch</button>
    <button type="button" class="dp-seg">Custo</button>
    <button type="button" class="dp-seg" aria-pressed="true">Cachê</button>
    <button type="button" class="dp-seg">Evento</button>
  </div>
  <div class="dp-seg-row" role="group" aria-label="Oferta">
    <button type="button" class="dp-seg" aria-pressed="true"><span>€120</span><small>oferta</small></button>
    <button type="button" class="dp-seg"><span>€150</span><small> </small></button>
    <button type="button" class="dp-seg"><span>€180</span><small>Barback</small></button>
  </div>
  <div class="dp-chips">
    <button type="button" class="dp-chip" aria-pressed="true"><span class="dp-chip-n">(7)</span>tudo</button>
    <button type="button" class="dp-chip"><span class="dp-chip-n">(2)</span>técnicas</button>
    <button type="button" class="dp-chip"><span class="dp-chip-n">(3)</span>clássicos</button>
  </div>
</div>
</body>
</html>
